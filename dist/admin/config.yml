backend:
  name: github
  repo: TheServCreator/Weber
  branch: main
  # Cloudflare Worker, tvarkantis GitHub prisijungimą. KOL KAS PLACEHOLDER —
  # pakeiskite pagal ADMIN-SETUP.md instrukciją.
  base_url: https://sveltia-cms-auth.stovyklos.workers.dev/

site_url: https://topgimtadieniai.lt
display_url: https://topgimtadieniai.lt

media_folder: public
public_folder: /

locale: lt

collections:
  - name: turinys
    label: Svetainės turinys
    files:
      - name: content
        label: Pagrindinis turinys
        file: src/data/content.json
        description: >
          Čia redaguojamas visas svetainės turinys. Išsaugojus pakeitimus,
          svetainė automatiškai atsinaujins per 1–2 minutes.
        fields:

          - label: Viršutinė juosta
            name: header
            widget: object
            summary: "Antraštė, telefonas, mygtukas"
            fields:
              - { label: Šūkio tekstas, name: tagline, widget: string, hint: "Rodomas antraštės juostoje virš puslapio." }
              - { label: Telefono numeris, name: phone, widget: string }
              - { label: Mygtuko tekstas, name: buttonText, widget: string, hint: "Rodomas ant raudono mygtuko antraštėje." }

          - label: Pagrindinė karuselė (hero)
            name: hero
            widget: object
            summary: "Viršuje rodoma didelė nuotraukų karuselė"
            fields:
              - label: Skaidrės
                name: slides
                widget: list
                collapsed: true
                summary: '{{fields.title}}'
                description: "Kiekviena skaidrė — viena nuotrauka su antrašte pagrindinės karuselės viršuje. Skaidrės neturi nuorodų."
                fields:
                  - { label: Nuotrauka, name: image, widget: image }
                  - { label: Nuotraukos aprašymas (prieinamumui), name: alt, widget: string, hint: "Trumpai aprašykite, kas matoma nuotraukoje." }
                  - { label: Antraštė, name: title, widget: string }
                  - { label: Paantraštė, name: sub, widget: string }
                  - label: "Sistemos raktas — NEKEISTI be reikalo"
                    name: objectPosition
                    widget: string
                    required: false
                    hint: "Techninis laukas nuotraukos apkirpimo pozicijai (pvz. 'center 45%'). Jei nežinote, palikite tuščią."

          - label: Šventės kortelės (viršutinė eilutė)
            name: partyCards
            widget: list
            collapsed: true
            summary: '{{fields.title}}'
            description: "Trys kortelės pagrindiniame puslapyje: Bricks4Kidz, Little Medical School, Meškučiai. Kiekviena su savo mini-karusele."
            fields:
              - { label: Pavadinimas, name: title, widget: string }
              - { label: Trumpas aprašymas, name: hint, widget: string }
              - label: Nuoroda
                name: link
                widget: string
                hint: "Nuorodos prasidedančios http(s):// atsidarys naujame lange. Vidinės nuorodos (pvz. /#teddy-birthdays) — tame pačiame puslapyje."
              - label: Nuotraukos
                name: images
                widget: list
                collapsed: true
                summary: '{{fields.alt}}'
                fields:
                  - { label: Nuotrauka, name: image, widget: image }
                  - { label: Nuotraukos aprašymas, name: alt, widget: string }

          - label: Pramogos
            name: pramogos
            widget: list
            collapsed: true
            summary: '{{fields.name}}'
            description: "Šis sąrašas naudojamas ir pagrindinio puslapio juostoje, ir 'Šventės Pramogos' puslapyje."
            fields:
              - { label: Pavadinimas, name: name, widget: string }
              - { label: Aprašymas, name: description, widget: text }
              - { label: Nuotrauka, name: image, widget: image }

          - label: Gimtadienio paketai
            name: packages
            widget: list
            collapsed: true
            summary: '{{fields.name}}'
            description: "Paketai rodomi ir pagrindiniame puslapyje, ir 'Gimtadienio paketai' puslapyje."
            fields:
              - label: "Sistemos raktas — NEKEISTI"
                name: key
                widget: select
                hint: "Nustato paketo spalvą ir ženkliuką svetainėje. Kiekvienam raktui kode priskirta fiksuota ikona — pasirinkite tą, kuri labiausiai tinka paketui."
                options:
                  - { label: "Bronzinis (ruda spalva)", value: bronze }
                  - { label: "Sidabrinis (pilka spalva)", value: silver }
                  - { label: "Auksinis (geltona spalva)", value: gold }
                  - { label: "Deimantinis (mėlyna spalva)", value: diamond }
              - { label: Pavadinimas, name: name, widget: string }
              - { label: "Trumpas aprašymas (pagrindiniame puslapyje)", name: hint, widget: string }
              - label: "Įžanga prieš sąrašą (paketo puslapyje)"
                name: plusLabel
                widget: string
                hint: "Pvz. 'Į paketą įeina:' arba 'Viskas iš Bronzinio paketo, plius:'"
              - label: "Ką apima paketas"
                name: contents
                widget: list
                hint: "Kiekviena eilutė — vienas punktas paketo sąraše."

          - label: Temos (rezervacijos formai)
            name: themes
            widget: list
            collapsed: true
            summary: '{{fields.brand}}'
            description: "Temų sąrašas, grupuojamas pagal šventės organizatorių. Pridėta arba ištrinta tema automatiškai atsiranda arba dingsta rezervacijos formoje."
            fields:
              - label: "Sistemos raktas — NEKEISTI be reikalo"
                name: brand
                widget: string
                hint: "Šventės organizatoriaus pavadinimas — grupės antraštė formoje."
              - label: Temos
                name: themes
                widget: list
                hint: "Kiekviena eilutė — viena tema. Pridėta/ištrinta tema automatiškai atsiranda/dingsta rezervacijos formoje."

          - label: Atsiliepimai
            name: testimonials
            widget: list
            collapsed: true
            summary: '{{fields.author}}'
            fields:
              - { label: Atsiliepimo tekstas, name: text, widget: text }
              - { label: Autorius, name: author, widget: string, hint: "Pvz. '— Jūratė M., Vilnius'" }

          - label: Kontaktai
            name: contact
            widget: object
            summary: "Telefonas, el. paštas, mygtukų tekstai"
            fields:
              - { label: Telefono numeris, name: phone, widget: string }
              - { label: El. paštas, name: email, widget: string }
              - { label: Pranešimas po rezervacijos, name: notice, widget: string, hint: "Rodomas po 'Rezervuoti' mygtuko rezervacijos formose." }
              - { label: "Mygtuko tekstas ('Susisiekite su mumis' sekcijoje)", name: reserveButtonText, widget: string }

          - label: Poraštės prekių ženklai
            name: brandsFooter
            widget: list
            collapsed: true
            summary: '{{fields.logoAlt}}'
            description: "Logotipai ir socialinių tinklų nuorodos puslapio apačioje."
            fields:
              - { label: Logotipas, name: logo, widget: image }
              - { label: Logotipo aprašymas, name: logoAlt, widget: string }
              - { label: Nuoroda į svetainę, name: link, widget: string }
              - label: Socialiniai tinklai
                name: socials
                widget: list
                collapsed: true
                summary: '{{fields.platform}}'
                fields:
                  - label: "Sistemos raktas — NEKEISTI"
                    name: platform
                    widget: select
                    hint: "Nustato, kuri ikona (Facebook/Instagram) bus rodoma."
                    options:
                      - { label: Facebook, value: facebook }
                      - { label: Instagram, value: instagram }
                  - { label: Nuoroda, name: url, widget: string }
