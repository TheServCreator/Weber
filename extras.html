<!doctype html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Papildomos pramogos – Gimtadieniai</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <header class="header" data-reveal>
    <div class="header-inner">
      <a class="brand" href="/">Gimtadieniai</a>
      <nav class="nav"><a class="nav-btn" href="/signup.html">Registracija</a></nav>
    </div>
  </header>

  <main class="container">
    <section class="section" data-reveal>
      <h1 class="page-title">Papildomos pramogos ✨</h1>
      <p class="page-sub">Piñata, animatoriai, veidukų piešimas ir t.t.</p>
    </section>

    <section class="section" data-reveal>
      <div class="extras">
        <label class="extra" data-accent="red"><input type="checkbox" /> 🪅 Piñata</label>
        <label class="extra" data-accent="blue"><input type="checkbox" /> 🤹 Animatoriai</label>
        <label class="extra" data-accent="green"><input type="checkbox" /> 🎨 Veidukų piešimas</label>
        <label class="extra" data-accent="red"><input type="checkbox" /> 🎈 Balionų dekoras</label>
        <label class="extra" data-accent="blue"><input type="checkbox" /> 🎁 Dovanų kampelis</label>
        <label class="extra" data-accent="green"><input type="checkbox" /> 📸 Fotografas</label>
      </div>

      <div class="callout" data-reveal>
        Užpildyk registraciją ir parašyk, ko nori – suderinsim kainas ir laiką.
        <div style="margin-top:12px"><a class="btn" href="/signup.html">Eiti į registraciją</a></div>
      </div>
    </section>
  </main>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
